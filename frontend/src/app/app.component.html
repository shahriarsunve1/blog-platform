<header class="app-header">
  <nav class="app-nav">
    <a routerLink="/posts" class="brand" aria-label="Resonate">
      <svg viewBox="0 0 340 60" class="brand-logo" role="img" aria-hidden="true">
        <path
          class="brand-logo-leaf"
          d="M24,4 C40,14 42,38 24,56 C6,38 8,14 24,4 Z"
        />
        <g class="brand-logo-veins">
          <line x1="24" y1="10" x2="24" y2="50" />
          <line x1="24" y1="20" x2="16" y2="14" />
          <line x1="24" y1="20" x2="32" y2="14" />
          <line x1="24" y1="30" x2="14" y2="24" />
          <line x1="24" y1="30" x2="34" y2="24" />
          <line x1="24" y1="40" x2="16" y2="34" />
          <line x1="24" y1="40" x2="32" y2="34" />
        </g>
        <g class="brand-logo-waves">
          <path d="M52,24 A8,8 0 0 1 52,36" />
          <path d="M52,16 A16,16 0 0 1 52,44" />
          <path d="M52,8 A24,24 0 0 1 52,52" />
        </g>
        <text x="96" y="41" class="brand-logo-text">RESONATE</text>
      </svg>
    </a>

    <button
      class="nav-toggle"
      type="button"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-label="Toggle navigation menu"
      (click)="toggleMobileMenu()"
    >
      {{ mobileMenuOpen ? '✕' : '☰' }}
    </button>

    <div class="nav-links" [class.open]="mobileMenuOpen" (click)="closeMobileMenu()">
      <a routerLink="/posts" routerLinkActive="active">Posts</a>

      <ng-container *ngIf="authService.currentUser$ | async as user; else guestLinks">
        <a routerLink="/my-posts" routerLinkActive="active">My Posts</a>
        <a routerLink="/posts/create" routerLinkActive="active" class="nav-cta">New Post</a>
        <a *ngIf="user.role === 'Admin'" routerLink="/admin" routerLinkActive="active">Admin</a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-user">{{ user.firstName || user.email }}</a>
        <button class="btn-link" (click)="logout()">Logout</button>
      </ng-container>

      <ng-template #guestLinks>
        <a routerLink="/auth/login" routerLinkActive="active">Login</a>
        <a routerLink="/auth/register" routerLinkActive="active">Register</a>
      </ng-template>
    </div>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
