<div class="auth-container">
  <div class="auth-card">
    <h2>Login</h2>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email"
          type="email" 
          formControlName="email"
          class="form-control"
          [class.is-invalid]="isFieldInvalid('email')"
          placeholder="user@example.com"
        />
        <div class="invalid-feedback" *ngIf="isFieldInvalid('email')">
          <span *ngIf="form.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="form.get('email')?.errors?.['email']">Invalid email format</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password"
          type="password" 
          formControlName="password"
          class="form-control"
          [class.is-invalid]="isFieldInvalid('password')"
          placeholder="••••••••"
        />
        <div class="invalid-feedback" *ngIf="isFieldInvalid('password')">
          Password is required
        </div>
        <div class="forgot-password-link">
          <a routerLink="/auth/forgot-password">Forgot password?</a>
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
        <ng-container *ngIf="showResendVerification && !resendSent">
          <br />
          <button type="button" class="btn-link" [disabled]="isResending" (click)="resendVerification()">
            {{ isResending ? 'Sending...' : 'Resend verification email' }}
          </button>
        </ng-container>
        <span *ngIf="showResendVerification && resendSent">
          <br />If an account with that email exists, a new verification link has been sent.
        </span>
      </div>

      <button
        type="submit" 
        class="btn btn-primary btn-block"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Logging in...
        </span>
      </button>
    </form>

    <div class="auth-toggle mt-3 text-center">
      <p>Don't have an account? <a routerLink="/auth/register">Register</a></p>
    </div>
  </div>
</div>
