<div class="auth-container">
  <div class="auth-card" *ngIf="submitted">
    <h2>Check your email</h2>
    <div class="alert alert-success">If an account with that email exists, a password reset link has been sent.</div>
    <div class="auth-toggle mt-3 text-center">
      <p><a routerLink="/auth/login">Back to login</a></p>
    </div>
  </div>

  <div class="auth-card" *ngIf="!submitted">
    <h2>Forgot password</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="isFieldInvalid('email')"
          placeholder="user@example.com"
        />
        <div class="invalid-feedback" *ngIf="isFieldInvalid('email')">
          <span *ngIf="form.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="form.get('email')?.errors?.['email']">Invalid email format</span>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Send reset link</span>
        <span *ngIf="isLoading">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Sending...
        </span>
      </button>
    </form>

    <div class="auth-toggle mt-3 text-center">
      <p><a routerLink="/auth/login">Back to login</a></p>
    </div>
  </div>
</div>
