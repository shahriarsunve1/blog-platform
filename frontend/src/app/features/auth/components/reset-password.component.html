<div class="auth-container">
  <div class="auth-card" *ngIf="success">
    <h2>Password reset!</h2>
    <div class="alert alert-success">Your password has been reset. You can log in now.</div>
    <div class="auth-toggle mt-3 text-center">
      <p><a routerLink="/auth/login">Go to login</a></p>
    </div>
  </div>

  <div class="auth-card" *ngIf="!success">
    <h2>Reset password</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="token">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          class="form-control"
          [class.is-invalid]="isFieldInvalid('newPassword')"
          placeholder="••••••••"
        />
        <div class="invalid-feedback" *ngIf="isFieldInvalid('newPassword')">
          <span *ngIf="form.get('newPassword')?.errors?.['required']">Password is required</span>
          <span *ngIf="form.get('newPassword')?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          class="form-control"
          [class.is-invalid]="isFieldInvalid('confirmPassword') || form.errors?.['passwordMismatch']"
          placeholder="••••••••"
        />
        <div class="invalid-feedback" *ngIf="isFieldInvalid('confirmPassword') || form.errors?.['passwordMismatch']">
          Passwords do not match
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Reset password</span>
        <span *ngIf="isLoading">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Resetting...
        </span>
      </button>
    </form>

    <div class="alert alert-danger" *ngIf="!token">
      {{ errorMessage }}
    </div>

    <div class="auth-toggle mt-3 text-center">
      <p><a routerLink="/auth/forgot-password">Request a new link</a></p>
    </div>
  </div>
</div>
