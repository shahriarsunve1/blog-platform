<div class="posts-container">
  <div class="posts-header">
    <h1>Blog Posts</h1>
    <div class="posts-header-actions">
      <a class="rss-link" [href]="feedUrl" target="_blank" rel="noopener" title="RSS feed">RSS</a>
      <button class="btn btn-primary btn-icon" (click)="createPost()" title="New Post" aria-label="New Post">
        <img src="assets/icon-post.png" alt="" />
      </button>
    </div>
  </div>

  <app-trending-rail></app-trending-rail>
  <app-suggested-for-you *ngIf="isLoggedIn"></app-suggested-for-you>

  <div class="posts-filters">
    <input
      type="search"
      class="search-input"
      placeholder="Search posts..."
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearchInput()"
    />

    <select class="filter-select" [(ngModel)]="selectedCategoryId" (ngModelChange)="onFilterChange()">
      <option value="">All categories</option>
      <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
    </select>

    <select class="filter-select" [(ngModel)]="selectedTagId" (ngModelChange)="onFilterChange()">
      <option value="">All tags</option>
      <option *ngFor="let tag of tags" [value]="tag.id">{{ tag.name }}</option>
    </select>

    <button class="clear-filters" *ngIf="hasActiveFilters" (click)="clearFilters()">
      Clear filters
    </button>
  </div>

  <div class="loading-spinner" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Loading posts...</p>
  </div>

  <div class="posts-grid" *ngIf="!isLoading && posts.length > 0">
    <app-post-card 
      *ngFor="let post of posts" 
      [post]="post"
      (click)="viewPost(post.id)"
      class="post-card-wrapper"
    ></app-post-card>
  </div>

  <div class="no-posts" *ngIf="!isLoading && posts.length === 0">
    <h3>No posts found</h3>
    <p>Start by creating your first blog post!</p>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button 
      class="btn btn-outline-primary" 
      (click)="previousPage()"
      [disabled]="currentPage === 1"
    >
      ← Previous
    </button>

    <div class="page-numbers">
      <button
        *ngFor="let page of pagesArray"
        class="btn btn-outline-secondary"
        [class.active]="page === currentPage"
        (click)="goToPage(page)"
      >
        {{ page }}
      </button>
    </div>

    <button 
      class="btn btn-outline-primary" 
      (click)="nextPage()"
      [disabled]="currentPage === totalPages"
    >
      Next →
    </button>
  </div>

  <div class="pagination-info" *ngIf="totalPages > 0">
    <p>Page {{ currentPage }} of {{ totalPages }} ({{ totalCount }} posts total)</p>
  </div>
</div>
