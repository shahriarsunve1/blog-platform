<div class="post-form-container">
  <div class="form-header">
    <h2>{{ isEditing ? 'Edit Post' : 'Create New Post' }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Title</label>
      <input 
        id="title"
        type="text" 
        formControlName="title"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('title')"
        placeholder="Enter post title"
      />
      <div class="invalid-feedback" *ngIf="isFieldInvalid('title')">
        <span *ngIf="form.get('title')?.errors?.['required']">Title is required</span>
        <span *ngIf="form.get('title')?.errors?.['minlength']">Title must be at least 3 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="excerpt">Excerpt</label>
      <textarea 
        id="excerpt"
        formControlName="excerpt"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('excerpt')"
        rows="3"
        placeholder="Enter post excerpt (summary)"
      ></textarea>
      <div class="invalid-feedback" *ngIf="isFieldInvalid('excerpt')">
        <span *ngIf="form.get('excerpt')?.errors?.['required']">Excerpt is required</span>
        <span *ngIf="form.get('excerpt')?.errors?.['minlength']">Excerpt must be at least 10 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <quill-editor
        id="content"
        formControlName="content"
        [modules]="quillModules"
        [class.is-invalid]="isFieldInvalid('content')"
        placeholder="Write your post content..."
        (onEditorCreated)="onEditorCreated($event)"
      ></quill-editor>
      <div class="invalid-feedback" *ngIf="isFieldInvalid('content')">
        <span *ngIf="form.get('content')?.errors?.['required']">Content is required</span>
        <span *ngIf="form.get('content')?.errors?.['minlength']">Content must be at least 50 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select 
        id="status"
        formControlName="status"
        class="form-control"
      >
        <option *ngFor="let status of statuses" [value]="status">
          {{ status }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Categories</label>
      <div class="chip-picker">
        <button
          type="button"
          *ngFor="let category of categories"
          class="chip"
          [class.selected]="isCategorySelected(category.id)"
          (click)="toggleCategory(category.id)"
        >
          {{ category.name }}
        </button>
      </div>
      <div class="add-taxonomy">
        <input
          type="text"
          placeholder="New category name..."
          [(ngModel)]="newCategoryName"
          [ngModelOptions]="{ standalone: true }"
          [disabled]="isAddingCategory"
          (keydown.enter)="$event.preventDefault(); addCategory()"
        />
        <button type="button" (click)="addCategory()" [disabled]="!newCategoryName.trim() || isAddingCategory">
          + Add
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>Tags</label>
      <div class="chip-picker">
        <button
          type="button"
          *ngFor="let tag of tags"
          class="chip"
          [class.selected]="isTagSelected(tag.id)"
          (click)="toggleTag(tag.id)"
        >
          {{ tag.name }}
        </button>
      </div>
      <div class="add-taxonomy">
        <input
          type="text"
          placeholder="New tag name..."
          [(ngModel)]="newTagName"
          [ngModelOptions]="{ standalone: true }"
          [disabled]="isAddingTag"
          (keydown.enter)="$event.preventDefault(); addTag()"
        />
        <button type="button" (click)="addTag()" [disabled]="!newTagName.trim() || isAddingTag">
          + Add
        </button>
      </div>
    </div>

    <div class="alert alert-danger" *ngIf="taxonomyError">
      {{ taxonomyError }}
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="form-actions">
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">{{ isEditing ? 'Update Post' : 'Create Post' }}</span>
        <span *ngIf="isLoading">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Saving...
        </span>
      </button>
      <button 
        type="button" 
        class="btn btn-outline-secondary"
        (click)="cancel()"
        [disabled]="isLoading"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
