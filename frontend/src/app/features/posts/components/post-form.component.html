<div class="post-form-container">
  <div class="form-header">
    <h2>{{ isEditing ? 'Edit Post' : 'Create New Post' }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Title</label>
      <input 
        id="title"
        type="text" 
        formControlName="title"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('title')"
        placeholder="Enter post title"
      />
      <div class="invalid-feedback" *ngIf="isFieldInvalid('title')">
        <span *ngIf="form.get('title')?.errors?.['required']">Title is required</span>
        <span *ngIf="form.get('title')?.errors?.['minlength']">Title must be at least 3 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="excerpt">Excerpt</label>
      <textarea 
        id="excerpt"
        formControlName="excerpt"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('excerpt')"
        rows="3"
        placeholder="Enter post excerpt (summary)"
      ></textarea>
      <div class="invalid-feedback" *ngIf="isFieldInvalid('excerpt')">
        <span *ngIf="form.get('excerpt')?.errors?.['required']">Excerpt is required</span>
        <span *ngIf="form.get('excerpt')?.errors?.['minlength']">Excerpt must be at least 10 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <textarea 
        id="content"
        formControlName="content"
        class="form-control"
        [class.is-invalid]="isFieldInvalid('content')"
        rows="10"
        placeholder="Enter post content (HTML supported)"
      ></textarea>
      <div class="invalid-feedback" *ngIf="isFieldInvalid('content')">
        <span *ngIf="form.get('content')?.errors?.['required']">Content is required</span>
        <span *ngIf="form.get('content')?.errors?.['minlength']">Content must be at least 50 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select 
        id="status"
        formControlName="status"
        class="form-control"
      >
        <option *ngFor="let status of statuses" [value]="status">
          {{ status }}
        </option>
      </select>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="form-actions">
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">{{ isEditing ? 'Update Post' : 'Create Post' }}</span>
        <span *ngIf="isLoading">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Saving...
        </span>
      </button>
      <button 
        type="button" 
        class="btn btn-outline-secondary"
        (click)="cancel()"
        [disabled]="isLoading"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
