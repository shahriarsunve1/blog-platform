<div class="post-card" (click)="onClick()">
  <div class="post-card-cover">
    <img *ngIf="post.coverImageUrl" [src]="post.coverImageUrl" alt="" />
    <div class="cover-placeholder" *ngIf="!post.coverImageUrl"></div>
  </div>

  <div class="post-card-header">
    <h3>{{ post.title }}</h3>
    <span class="badge" [class]="'badge-' + post.status.toLowerCase()">
      {{ post.status }}
    </span>
  </div>

  <p class="post-excerpt">{{ post.excerpt }}</p>

  <div class="post-tags">
    <span
      class="tag-chip"
      [class.tag-chip-category]="tag.isCategory"
      *ngFor="let tag of visibleTags"
    >{{ tag.label }}</span>
    <span class="tag-chip tag-chip-more" *ngIf="hiddenTagCount > 0">+{{ hiddenTagCount }}</span>
  </div>

  <div class="post-card-footer">
    <div class="post-meta">
      <a
        class="author"
        *ngIf="post.author"
        [routerLink]="['/authors', post.author.id]"
        (click)="$event.stopPropagation()"
      >
        {{ post.author.firstName }} {{ post.author.lastName }}
      </a>
      <span class="date">{{ post.publishedAt | date: 'short' }}</span>
    </div>
    <div class="post-stats">
      <span class="likes" *ngIf="post.likeCount > 0">♥ {{ post.likeCount }}</span>
      <span class="views">
        <i class="icon-eye"></i> {{ post.viewCount }}
      </span>
    </div>
  </div>

  <div class="card-hover-action">
    Read More →
  </div>
</div>
